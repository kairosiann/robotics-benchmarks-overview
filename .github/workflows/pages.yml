name: Publish benchmark website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Set up Node for search validation
        uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Validate catalog and build website
        run: |
          python3 build_data.py
          python3 validate_catalog.py
          python3 build_report.py
          python3 build_site.py
          python3 validate_site.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published catalog is reachable
        env:
          BENCHMARK_PAGES_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 15 "${BENCHMARK_PAGES_URL%/}/catalog.json" --output /tmp/published-benchmark-catalog.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected = json.loads(Path('_site/catalog.json').read_text())
          published = json.loads(Path('/tmp/published-benchmark-catalog.json').read_text())
          assert published == expected, 'Published catalog differs from the deployment artifact'
          print(f'Public HTTPS check passed for all {len(published):,} catalog entries')
          PY
